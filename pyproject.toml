[project]
name = "docintel"
version = "0.1.0"
description = "Modular Document Intelligence / RAG platform — domain-agnostic, collection-based knowledge bases."
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",   # required by FastAPI for UploadFile/form parsing
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "qdrant-client>=1.12",
    "openai>=1.54",              # NVIDIA API is OpenAI-compatible; used as the HTTP client for NIM endpoints
    "markitdown[all]",            # [all] extra required for docx/pptx/xlsx/pdf conversion
    "beautifulsoup4>=4.12",      # HTML parsing / cleaning
    "httpx>=0.27",               # async HTTP for web loader
    "pytesseract>=0.3.13",       # OCR for image loader
    "pillow>=11.0",
    "tenacity>=9.0",             # retry/backoff for external API calls
    "structlog>=24.4",           # structured logging
    "rank-bm25>=0.2",              # BM25 sparse retrieval + default lexical reranker
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/docintel"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/docintel/api/**/*.py" = ["B008"]  # FastAPI's Depends() in defaults is the documented pattern

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = "pytesseract.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "rank_bm25.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
